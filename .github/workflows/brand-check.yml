name: Brand check report

on:
  # n8n fires this when a validated lead arrives
  repository_dispatch:
    types: [brand-check]
  # manual runs for testing: Actions tab -> Run workflow
  workflow_dispatch:
    inputs:
      brand:
        description: "Brand name"
        required: true
      email:
        description: "Lead email (optional for tests)"
        required: false
        default: ""
      first_name:
        description: "Lead first name (optional)"
        required: false
        default: ""

jobs:
  report:
    runs-on: ubuntu-latest
    # Marketplace pulls now run to exhaustion, and runner IPs get rate limited
    # hard, so a big brand can take half an hour. GRAB_BUDGET_S stops the
    # collection cleanly before this ceiling and labels the counts a floor.
    # Normal runs land at 45-55 min, so 60 was routinely hit under 429
    # pressure (30 Aug run died at the ceiling with no alert).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet reportlab svglib Pillow segno

      - name: Resolve inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "brand=${{ github.event.client_payload.brand }}" >> "$GITHUB_OUTPUT"
            echo "email=${{ github.event.client_payload.email }}" >> "$GITHUB_OUTPUT"
            echo "first_name=${{ github.event.client_payload.firstName }}" >> "$GITHUB_OUTPUT"
            echo "hubspot_url=${{ github.event.client_payload.hubspotUrl }}" >> "$GITHUB_OUTPUT"
          else
            echo "brand=${{ inputs.brand }}" >> "$GITHUB_OUTPUT"
            echo "email=${{ inputs.email }}" >> "$GITHUB_OUTPUT"
            echo "first_name=${{ inputs.first_name }}" >> "$GITHUB_OUTPUT"
            echo "hubspot_url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Slack configuration
        run: |
          if [ -n "${{ secrets.SLACK_BOT_TOKEN }}" ] && [ -n "${{ secrets.SLACK_CHANNEL_ID }}" ]; then
            echo "SLACK_READY=true" >> "$GITHUB_ENV"
          else
            echo "SLACK_READY=false" >> "$GITHUB_ENV"
            echo "::notice::Slack secrets not set yet - report will build but not post. Download it from the run artifacts."
          fi

      # Before the build, so the owner hears about it even when the report
      # fails. A brand check from a contact sales already owns is a buying
      # signal, and it used to reach nobody: the form is not a HubSpot form,
      # so no HubSpot workflow enrols and #mql-leads stays silent.
      - name: Alert the contact owner if sales already owns this lead
        continue-on-error: true
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          python3 automation/notify_owner.py \
            --email "${{ steps.inputs.outputs.email }}" \
            --brand "${{ steps.inputs.outputs.brand }}"

      - name: Collect data and build report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Platform session token (expires ~30 days). Without it the platform
          # check is skipped and the draft says so; the verified-account gate
          # still blocks absence claims.
          GEEIQ_API_TOKEN: ${{ secrets.GEEIQ_API_TOKEN }}
          GRAB_BUDGET_S: "2400"
        run: |
          cd report
          python3 run.py --brand "${{ steps.inputs.outputs.brand }}"

      - name: Post draft to Slack for approval
        if: ${{ env.SLACK_READY == 'true' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          BRAND="${{ steps.inputs.outputs.brand }}"
          SLUG=$(echo "$BRAND" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-//;s/-$//')
          OUT="report/out/$SLUG"
          python3 automation/post_to_slack.py \
            --brand "$BRAND" \
            --email "${{ steps.inputs.outputs.email }}" \
            --first-name "${{ steps.inputs.outputs.first_name }}" \
            --hubspot-url "${{ steps.inputs.outputs.hubspot_url }}" \
            --pdf "$OUT"/GEEIQ_Brand_check_*.pdf \
            --email-draft "$OUT/email_draft.txt" \
            --summary "$OUT/analyst_summary.txt"

      - name: Alert the team if the run failed
        # cancelled() covers the job timeout: GitHub cancels rather than
        # fails a timed-out job, so a plain failure() gate stayed silent
        # when the 30 Aug run hit the ceiling and that lead was lost.
        if: ${{ (failure() || cancelled()) && env.SLACK_READY == 'true' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          BRAND: ${{ steps.inputs.outputs.brand }}
          LEAD_EMAIL: ${{ steps.inputs.outputs.email }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          # A failed run must never be silent: the lead already saw the
          # success page, so if nobody is told, the lead is simply lost.
          import json, os, urllib.request
          if os.environ["JOB_STATUS"] == "cancelled":
              why = ("The run was cancelled, most likely the job timeout. "
                     "Rerun it from the Actions tab; if it keeps timing out, "
                     "build the report manually.")
          else:
              why = ("Junk brand names (URLs, gibberish) fail here by design, "
                     "BUT Roblox also returns zero catalog results for some "
                     "protected real brands (Nike, Aston Martin, Rolls Royce). "
                     "If the brand is real, check the run log for 'items ... 0 rows' "
                     "and build the report manually.")
          text = (":rotating_light: *Brand check FAILED*: "
                  f"{os.environ['BRAND']!r} for {os.environ['LEAD_EMAIL'] or 'n/a'}. "
                  "No draft was created and the lead has NOT been emailed, but they "
                  f"saw the success page. {why} <{os.environ['RUN_URL']}|Run log>")
          req = urllib.request.Request(
              "https://slack.com/api/chat.postMessage",
              data=json.dumps({"channel": os.environ["SLACK_CHANNEL_ID"], "text": text}).encode(),
              headers={"Authorization": "Bearer " + os.environ["SLACK_BOT_TOKEN"],
                       "Content-Type": "application/json; charset=utf-8"})
          print(urllib.request.urlopen(req, timeout=30).read()[:200])
          PY

      - name: Keep artifacts for the record
        uses: actions/upload-artifact@v4
        with:
          name: brand-check-${{ steps.inputs.outputs.brand }}
          path: |
            report/out/**/*.pdf
            report/out/**/email_draft.txt
            report/out/**/analyst_summary.txt
          retention-days: 30
